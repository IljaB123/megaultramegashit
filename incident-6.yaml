
apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-6-config
  namespace: ica-training
data:
  APP_MESSAGE: "Hello from ConfigMap"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-6
  namespace: ica-training
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-6
  template:
    metadata:
      labels:
        app: incident-6
    spec:
      containers:
        - name: web
          image: python:3.12-slim-bookworm
          command:
            - python
            - -m
            - http.server
            - "8080"
          ports:
            - containerPort: 8080
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: incident-6-config
                  key: APP_MESSAGE
