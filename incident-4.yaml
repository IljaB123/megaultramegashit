
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-4
  namespace: ica-training

spec:
  replicas: 1

  selector:
    matchLabels:
      app: incident-4

  template:
    metadata:
      labels:
        app: incident-4

    spec:
      containers:
        - name: web
          image: python:3.12-slim-bookworm

          command:
            - python
            - -m
            - http.server
            - "8080"

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: 50m
              memory: 32Mi

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
