
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-10
  namespace: ica-training

spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-10

  template:
    metadata:
      labels:
        app: incident-10

    spec:
      containers:
        - name: web
          image: python:3.12-slim-bookworm

          command:
            - python
            - -m
            - http.server
            - "8080"

          ports:
            - containerPort: 8080

          volumeMounts:
            - name: app-storage
              mountPath: /data

      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: incident-10-storage
