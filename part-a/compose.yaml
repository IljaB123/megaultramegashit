
services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: training-password

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    image: ica-part-a:v0.1.0

    ports:
      - "8086:8080"

    environment:
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: training-password

    depends_on:
      - db

volumes:
  postgres_data:
