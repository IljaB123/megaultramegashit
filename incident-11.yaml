
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-11
  namespace: ica-training

spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-11

  template:
    metadata:
      labels:
        app: incident-11

    spec:
      containers:
        - name: web
          image: python:3.12-slim-bookworm

          command:
            - python
            - -u
            - -c

          args:
            - |
              import time

              print("Starting application")

              data = bytearray(80 * 1024 * 1024)

              print("Application started successfully")

              while True:
                  time.sleep(10)

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi


